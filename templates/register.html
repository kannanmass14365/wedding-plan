<form method="POST" action="{{ url_for('register') }}">
    <table>
        <tr>
            <td>Username</td>
            <td>
                <input type="text"
                       name="username"
                       id="user"
                       placeholder="Username"
                       required>
            </td>
        </tr>
        <tr>
            <td>Password</td>
            <td>
                <input type="password"
                       name="password"
                       id="password"
                       placeholder="Password"
                       required>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <button type="submit">Register</button>
            </td>
        </tr>
    </table>
</form>

<p>{{ message }}</p>
