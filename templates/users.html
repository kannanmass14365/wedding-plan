<!DOCTYPE html>
<html>
<head>
    <title>Registered Users</title>
</head>
<body>
    <h1>Registered Users</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Action</th>
        </tr>

        {% for user in users %}
      <tr>
    <td>{{ user.id }}</td>
    <td>{{ user.username }}</td>
    <a href="{{ url_for('edit_user', user_id=user.id) }}">Edit</a>
    <td>
        <form method="POST"
              action="{{ url_for('delete_user', user_id=user.id) }}">
            <button type="submit">Delete</button>
        </form>
    </td>
</tr>
        {% endfor %}
    </table>

    <a href="/">Back to Home</a>
</body>
</html>
